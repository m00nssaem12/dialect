<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방언 능력 고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
@counter-style circ{system:fixed;symbols:"①" "②" "③" "④" "⑤";suffix:" "}
:root{--bg:#dcd8cd;--card:#fff;--ink:#1a1a1a;--sub:#666;--pri:#1a1a1a;--acc:#d63b3b;--soft:#f3f0e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Batang","Nanum Myeongjo","Malgun Gothic",serif;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--card);border:3px double #444;padding:24px 20px;text-align:left;box-shadow:0 3px 10px rgba(0,0,0,.18)}
#end.card{background:none;border:0;padding:0;box-shadow:none}
.tt{text-align:center;font-size:30px;font-weight:900;letter-spacing:6px;border-bottom:3px solid var(--ink);padding-bottom:8px}
.meta{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ink);padding:6px 0;font-weight:700;font-size:14px}
h1{font-size:28px;margin:8px 0}
h3{margin:18px 0 8px;font-size:16px;border-left:5px solid var(--ink);padding-left:8px}
.sub{color:var(--sub);font-size:14px}
.btn{display:block;width:100%;border:2px solid var(--ink);border-radius:3px;padding:14px;font-size:18px;font-weight:800;background:var(--pri);color:#fff;cursor:pointer;margin-top:12px;font-family:inherit}
.btn:disabled{opacity:.35;cursor:not-allowed}
.opt{background:#fff;color:var(--ink);margin-top:8px;text-align:left;font-weight:600;font-size:17px}
#opts{counter-reset:o}#opts .opt::before{counter-increment:o;content:counter(o,circ);font-size:19px}
.opt.ok{border-color:var(--acc);color:var(--acc);font-weight:800}.opt.ok::after{content:"  ○ 정답"}
.opt.no{border-color:var(--acc);background:#fdf1ef}.opt.no::after{content:"  ／";color:var(--acc);font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:3px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);color:#fff}
.bar{height:14px;border:2px solid var(--ink);background:#fff;margin-bottom:12px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#1a1a1a 0 4px,#555 4px 8px);width:0;transition:width .3s}
.tag{display:inline-block;border:1.5px solid var(--ink);padding:1px 10px;font-size:13px;font-weight:800;margin-right:4px}
.tag.lv{background:var(--ink);color:#fff}
.q{font-size:24px;font-weight:900;margin:6px 0 14px;word-break:keep-all;border:2px solid var(--ink);padding:12px 14px;text-align:center;background:var(--soft)}
.exp{margin-top:12px;padding:10px 12px;background:#fdf1ef;border-left:4px solid var(--acc);font-size:15px}
.hide{display:none}
.rs{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700}
.rs span:first-child{width:56px}
.rs .tr{flex:1;height:14px;border:2px solid var(--ink);background:#fff}
.rs .tr i{display:block;height:100%;background:var(--ink)}
.rs span:last-child{width:50px;text-align:right}
.paper{background:#fff;color:#1a1a1a;border:3px double #444;padding:22px 18px;text-align:left;margin-top:14px;font-family:"Noto Serif KR","Batang","Nanum Myeongjo",serif;position:relative}
.paper .tt{text-align:center;font-size:26px;font-weight:900;letter-spacing:4px;border-bottom:3px solid #1a1a1a;padding-bottom:6px}
.paper .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #1a1a1a;padding:8px 0;font-weight:700;font-size:14px}
.paper .ph input{border:0;border-bottom:1px solid #1a1a1a;background:transparent;font:inherit;width:84px;color:#1a1a1a;border-radius:0}
.paper .sc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid #1a1a1a;margin-bottom:12px}
.paper .gr{font-size:15px}.paper .gr b{font-size:20px;margin:0 6px}.paper .gr p{margin:2px 0 0;color:#555;font-size:13px}
.stamp{width:96px;height:96px;border:4px solid #d63b3b;border-radius:50%;color:#d63b3b;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);flex:none;font-family:"Nanum Pen Script","Gaegu",cursive,sans-serif}
.stamp small{font-size:18px}
.cols2{column-gap:26px;column-rule:1px solid #ccc}
.qi{position:relative;break-inside:avoid;padding:4px 0 10px 38px;margin-bottom:8px;border-bottom:1px dotted #bbb;font-size:15px;line-height:1.55}
.qi .mk{position:absolute;left:0;top:2px;width:30px;height:30px;color:#d63b3b;font-weight:900}
.qi .mk.o{border:3px solid #d63b3b;border-radius:50%}
.qi .mk.x{font-size:34px;line-height:28px;text-align:center}
.qi em{font-style:normal;font-size:11px;color:#555;margin-left:6px;border:1px solid #999;padding:0 5px;white-space:nowrap}
.qi .sb{border:1px solid #1a1a1a;padding:4px 8px;margin:4px 0;font-weight:700}
.qi .ch{padding-left:4px}
.qi .ch.me{font-weight:800;text-decoration:underline;text-decoration-color:#d63b3b;text-decoration-thickness:2px}
.qi .ch.rt{color:#d63b3b;font-weight:800}
.qi .ex2{margin-top:4px;padding:4px 8px;background:#fdf1ef;border-left:3px solid #d63b3b;color:#8a2a22;font-size:13px}
.sx{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}@media (max-width:560px){.sx{grid-template-columns:1fr}}
.paper .cond{font-size:13px;font-weight:700;padding:6px 0;border-bottom:1px solid #1a1a1a}.paper .cond b{display:inline-block;border:1.5px solid #1a1a1a;padding:0 8px;margin-right:4px;font-size:12px}
@media print{.cols2{column-count:2}.paper{border-width:2px}}
#exam .pg{background:#fff;color:#111;border:1px solid #bbb;padding:22px 20px;margin-top:14px;font-size:15px}
#exam h1{text-align:center;font-size:24px;margin:0 0 10px;letter-spacing:2px}
#exam .eh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border:2px solid #111;padding:8px 10px;font-weight:700;font-size:14px}
#exam .nt{font-size:13px;margin:8px 0 12px}
#exam .cols{column-count:2;column-gap:26px;column-rule:1px solid #bbb}
#exam .eq{break-inside:avoid;margin-bottom:16px;line-height:1.55}
#exam .eq .sb{border:1px solid #111;padding:5px 8px;margin:4px 0 5px;font-weight:700}
#exam .key .ans{break-inside:avoid;font-size:14px;margin-bottom:5px}
@page{size:A4;margin:13mm}
@media print{body{background:#fff}#start,#quiz,.btn,.noprint{display:none!important}.card{border:0}.wrap{max-width:none;padding:0}#exam .pg{border:0;padding:0;margin:0}#exam .key{break-before:page}#exam.nokey .key{display:none}}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn:active,.chip:active{transform:scale(.97)}
#tools{display:none}
body.board{user-select:none;-webkit-user-select:none}
body.board .wrap{max-width:1400px;padding:2vh 3vw 4vh}
body.board #tools{display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px}
body.board #tools .chip{font-size:20px;padding:10px 20px}
body.board .bar{height:22px}
body.board #quiz .card{padding:2.5vh 3vw}
body.board .tag{font-size:22px;padding:4px 16px}
body.board #num{font-size:22px}
body.board #ask{font-size:30px!important;margin-top:6px}
body.board .q{font-size:clamp(40px,5.5vw,80px);padding:2vh 2vw;margin:1vh 0 2vh}
body.board #opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
body.board #opts .opt{margin:0;min-height:11vh;font-size:clamp(24px,2.8vw,42px);padding:16px 22px;display:flex;align-items:center;gap:12px;border-width:3px;word-break:keep-all}
body.board #opts .opt::before{font-size:1.15em}
body.board .opt.ok::after,body.board .opt.no::after{margin-left:auto}
body.board .exp{margin-top:1.5vh;font-size:clamp(20px,2vw,30px);padding:16px 20px;border-left-width:8px}
body.board #next{font-size:clamp(26px,2.6vw,38px);padding:16px;min-height:8vh}
body.board #start{padding:4vh 4vw}
body.board #start .tt{font-size:48px}
body.board #start h3{font-size:26px;margin-top:3vh}
body.board #start .meta,body.board #start .sub{font-size:20px}
body.board .chip{font-size:24px;padding:14px 26px;border-width:3px}
body.board .row{gap:14px}
body.board #start .btn{font-size:28px;padding:22px}
body.board .paper .qi{font-size:19px}
body.board #end .btn{font-size:26px;padding:20px}
@media (max-width:760px){body.board #opts{grid-template-columns:1fr}}
body.board .q.long{font-size:clamp(30px,3.8vw,58px)}
body.board .q.xlong{font-size:clamp(26px,3vw,46px)}
@media (max-height:820px){body.board .wrap{padding-top:1vh}body.board #tools{margin-bottom:6px}body.board #tools .chip{font-size:17px;padding:6px 14px}body.board .bar{height:14px;margin-bottom:8px}body.board .tag{font-size:18px}body.board #num{font-size:18px;margin-top:4px!important}body.board #ask{font-size:24px!important;margin-top:2px}body.board .q{padding:1.2vh 2vw;margin:.6vh 0 1.4vh}body.board #opts{gap:10px}body.board #opts .opt{min-height:0;padding:10px 18px;font-size:clamp(22px,2.6vw,34px)}body.board .exp{margin-top:1vh;padding:10px 16px;font-size:clamp(18px,1.8vw,24px)}body.board #next{min-height:0;padding:12px;margin-top:8px}}
@media print{#tools{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div id="start" class="card">
    <div class="tt">방언 능력 고사</div>
    <div class="meta"><span>제1교시 국어(방언) 영역</span><span>수험번호 (        )</span></div>
    <p class="sub" style="margin:10px 0 0">※ 아래 ①~④의 시험 조건을 정한 뒤 [시험 시작]을 누르시오.</p>
    <h3>① 지역 (여러 개 선택 가능)</h3>
    <div class="row" id="regs"></div>
    <h3>② 난이도</h3>
    <div class="row" id="lvs"></div>
    <h3>③ 문제 수</h3>
    <div class="row" id="cnts"></div>
    <h3>④ 화면</h3>
    <div class="row" id="scr"></div>
    <p class="sub" id="info" style="margin-top:14px"></p>
    <button class="btn" id="go" onclick="begin()">시험 시작</button>
    <button class="btn opt" id="mk" onclick="exam()" style="text-align:center">🖨️ 시험지(인쇄용) 만들기</button>
  </div>
  <div id="quiz" class="hide">
    <div id="tools"><button class="chip" onclick="fullTog()">⛶ 전체 화면</button><button class="chip" onclick="quit(event)">⌂ 그만하기</button></div>
    <div class="bar"><i id="pg"></i></div>
    <div class="card">
      <span class="tag" id="reg"></span><span class="tag lv" id="lv"></span>
      <div class="sub" id="num" style="margin-top:8px"></div>
      <div class="sub" id="ask" style="font-weight:700;color:var(--ink);font-size:16px">이 말의 뜻은?</div>
      <div class="q" id="q"></div>
      <div id="opts"></div>
      <div id="exp" class="exp hide"></div>
      <button id="next" class="btn hide" onclick="next()">다음 문제</button>
    </div>
  </div>
  <div id="exam" class="hide">
    <div class="noprint"><button class="btn" onclick="printEx(1)">문제지 + 정답지 인쇄</button><button class="btn opt" onclick="printEx(0)" style="text-align:center">문제지만 인쇄</button><button class="btn opt" onclick="closeExam()" style="text-align:center">처음으로</button></div>
    <div id="exb"></div>
  </div>
  <div id="end" class="card hide">
    <div class="paper">
      <div class="tt">방언 능력 고사</div>
      <div class="ph"><span>학년 반 번호 <input id="cl"></span><span>이름 <input id="nm"></span><span>날짜 <span id="dt"></span></span></div>
      <div class="cond" id="cond"></div><div class="sc"><div class="gr"><span id="emoji"></span><b id="grade"></b><p id="msg"></p></div><div class="stamp" id="stamp"></div></div>
      <div class="cols2" id="items"></div>
      <div class="sx"><div><h3>지역별 점수</h3><div id="rsc"></div></div><div><h3>난이도별 점수</h3><div id="lsc"></div></div></div>
    </div>
    <button class="btn noprint" onclick="window.print()">시험지 인쇄하기</button>
    <button class="btn opt noprint" onclick="begin()" style="text-align:center">같은 조건으로 다시</button>
    <button class="btn opt noprint" onclick="toSetup()" style="text-align:center">조건 다시 정하기</button>
    <p id="score" class="hide"></p>
  </div>
</div>
<script>
var R={g:"경상도",j:"전라도",c:"충청도",k:"강원도",z:"제주도"};
var LV={1:"쉬움",2:"보통",3:"어려움",4:"도전"};
// [지역, 난이도, 방언 문장, 정답, [오답3], 해설]
var D=[
["g",1,"니 어데 가노?","너 어디 가니?",["너 어디서 왔니?","너 어디 있었니?","너 어디 아프니?"],"'어데'는 '어디', '~노?'는 '~니?'예요."],
["g",1,"고마 해라, 마!","그만 해라!",["그냥 해라!","그만 가라!","고맙다고 해라!"],"'고마'는 '그만'이에요."],
["g",1,"밥 뭇나?","밥 먹었니?",["밥 먹을래?","밥 먹고 있니?","밥 안 먹었니?"],"'묵다'는 '먹다', '뭇나'는 '먹었니'예요."],
["g",2,"이 빵 억수로 맛있다.","이 빵 아주 맛있다.",["이 빵 조금 맛있다.","이 빵 제일 맛있다.","이 빵 아직 맛있다."],"'억수로'는 '아주, 매우'예요."],
["g",2,"엄마가 정구지 무침 해 줬다.","부추 무침",["미나리 무침","쪽파 무침","깻잎 무침"],"'정구지'는 '부추'예요."],
["g",2,"“니 숙제 했나?” “하모!”","그럼! (당연하지!)",["맞아, 조금만 했어!","아니, 안 했어!","아직 다 못 했어!"],"'하모'는 '그럼, 당연하지'예요."],
["g",3,"정지에 불 좀 켜라.","부엌에 불 좀 켜라.",["마루에 불 좀 켜라.","창고에 불 좀 켜라.","현관에 불 좀 켜라."],"'정지'는 '부엌'을 뜻해요."],
["g",3,"청소 단디 해라.","청소 잘 (꼼꼼히) 해라.",["청소 대충 해라.","청소 일찍 해라.","청소 먼저 해라."],"'단디'는 '단단히, 잘, 꼼꼼히'예요."],
["j",1,"아따, 겁나 맛나부러!","아, 정말 맛있다!",["아, 너무 짜다!","아, 배부르다!","아, 너무 뜨겁다!"],"'겁나'는 '매우', '~부러'는 강조예요."],
["j",1,"쪼까 기다려잉.","조금 기다려.",["오래 기다려.","조금 서둘러.","조금 쉬어."],"'쪼까'는 '조금'이에요."],
["j",2,"워메~ 깜짝이야!","어머나~ 깜짝이야!",["아이고~ 큰일이야!","어휴~ 지겨워!","어라~ 이상하네!"],"'워메'는 '어머나'예요."],
["j",2,"운동장에 사람이 허벌나게 많다.","운동장에 사람이 아주 많다.",["운동장에 사람이 제법 있다.","운동장에 사람이 조금 있다.","운동장에 사람이 아직 없다."],"'허벌나게'는 '아주, 굉장히'예요."],
["j",2,"오늘 징하게 덥네잉.","오늘 몹시 (정말) 덥네.",["오늘 조금 덥네.","오늘 갑자기 덥네.","오늘 별로 안 덥네."],"'징하게'는 '몹시, 지독하게'예요."],
["j",3,"싸게 와라잉!","빨리 와라!",["싸게(값싸게) 사라!","천천히 와라!","같이 와라!"],"전라도 '싸게'는 값이 아니라 '빨리'예요."],
["c",1,"얼릉 와유!","빨리 오세요!",["천천히 오세요!","먼저 오세요!","다시 오세요!"],"'얼릉'은 '얼른', '~유'는 높임 말투예요."],
["c",1,"그랴, 그랴.","그래, 그래.",["그래도, 그래도.","글쎄, 글쎄.","거기, 거기."],"'그랴'는 '그래'예요."],
["c",1,"밥 먹었슈?","밥 먹었어요?",["밥 먹을래요?","밥 먹고 있어요?","밥 안 먹어요?"],"'~슈'는 '~어요'처럼 쓰는 충청도 말투예요."],
["c",2,"뭐더러 그랴?","뭐 하러 그러니?",["뭘 그렇게 하니?","뭐라고 그러니?","뭐가 그러니?"],"'뭐더러'는 '뭐 하러'예요."],
["c",2,"내가 갈껴.","내가 갈 거야.",["내가 갈까?","내가 갔어.","내가 가고 있어."],"'~껴'는 '~ㄹ 거야'예요."],
["g",3,"여기 무시 좀 가져온나.","여기 무 좀 가져와라.",["여기 물 좀 가져와라.","여기 무시무시한 것 좀 가져와라.","여기 파 좀 가져와라."],"'무시'는 '무'를 부르는 말이에요."],
["c",3,"바닥에 탑세기가 많네유.","바닥에 먼지가 많네요.",["바닥에 물이 많네요.","바닥에 사람이 많네요.","바닥이 아주 넓네요."],"'탑세기'는 '먼지'예요."],
["c",3,"오늘 일을 많이 했더니 대간하네.","오늘 일을 많이 했더니 고단하네.",["오늘 일을 많이 했더니 즐겁네.","오늘 일을 많이 했더니 배고프네.","오늘 일을 많이 했더니 춥네."],"'대간하다'는 '고단하다, 피곤하다'예요."],

function pick(btn,right){
  if(locked)return;locked=true;pickAt=Date.now();var d=Q[idx];d.my=btn.textContent;
  if(right){score++;tally[d[0]][0]++;btn.classList.add("ok")}else btn.classList.add("no");
  Array.prototype.forEach.call($("opts").children,function(b){if(b.textContent===d[3])b.classList.add("ok")});
  $("exp").textContent=(right?"⭕ 정답! ":"❌ 아쉬워요. 정답은 '"+d[3]+"'. ")+d[5];
  $("exp").classList.remove("hide");
  $("next").textContent=idx==Q.length-1?"결과 보기":"다음 문제";$("next").classList.remove("hide");
  if(board)$("next").scrollIntoView({block:"nearest",behavior:"smooth"})
}
function next(){if(!locked||Date.now()-pickAt<450)return;idx++;if(idx>=Q.length)finish();else show()}
function finish(){
  $("quiz").classList.add("hide");$("end").classList.remove("hide");
  var r=score/Q.length;
  var g=r>=.9?["🏆","방언 박사"]:r>=.7?["🥇","방언 달인"]:r>=.4?["🌱","방언 새싹"]:["🌰","방언 씨앗"];
  $("emoji").textContent=g[0];$("grade").textContent=g[1];
  $("score").textContent=Q.length+"문제 중 "+score+"문제 정답!";
  $("msg").textContent=r>=.9?"방언을 거의 다 알아요!":r>=.7?"거의 다 맞혔어요!":"다시 도전하면 더 잘할 수 있어요!";
  var h="";
  Object.keys(R).forEach(function(k){if(tally[k]){var t=tally[k];h+='<div class="rs"><span>'+R[k]+'</span><span class="tr"><i style="width:'+(t[0]/t[1]*100)+'%"></i></span><span>'+t[0]+'/'+t[1]+'</span></div>'}});
  $("rsc").innerHTML=h;
  var lt={};Q.forEach(function(d){var t=lt[d[1]]=lt[d[1]]||[0,0];t[1]++;if(d.my===d[3])t[0]++});
  h="";[1,2,3,4].forEach(function(v){if(lt[v]){var t=lt[v];h+='<div class="rs"><span>'+LV[v]+'</span><span class="tr"><i style="width:'+(t[0]/t[1]*100)+'%"></i></span><span>'+t[0]+'/'+t[1]+'</span></div>'}});
  $("lsc").innerHTML=h;
  var rg=Object.keys(R).filter(function(k){return selR[k]}).map(function(k){return R[k]});
  $("cond").innerHTML='<b>응시 조건</b> 지역: '+(rg.length==5?"전 지역":rg.join("·"))+' &nbsp;/&nbsp; 난이도: '+(selL?LV[selL]:"전체(섞어서)")+' &nbsp;/&nbsp; '+Q.length+'문제';
  sheet()
}
function sheet(){
  var n=Q.length,pt=Math.round(score/n*100);
  $("dt").textContent=new Date().toLocaleDateString("ko-KR");
  $("stamp").innerHTML=pt+"<small>점</small>";
  var h="";
  Q.forEach(function(d,i){var ok=d.my===d[3],r=d[1]==4;
    h+='<div class="qi"><span class="mk '+(ok?"o":"x")+'">'+(ok?"":"／")+'</span><div><b>'+(i+1)+'.</b> '+(r?d[2]:"다음 방언의 뜻으로 알맞은 것은?")+'<em>'+label(d)+'·'+LV[d[1]]+'</em></div>'+(r?"":'<div class="sb">'+d[2]+'</div>')
    +d.o.map(function(t,j){var c=t===d.my?"me":"";if(!ok&&t===d[3])c+=" rt";return '<div class="ch '+c+'">'+"①②③④".charAt(j)+" "+t+(!ok&&t===d[3]?" ✔":"")+'</div>'}).join("")
    +(ok?"":'<div class="ex2">'+d[5]+'</div>')+'</div>'});
  $("items").innerHTML=h
}
document.addEventListener("keydown",function(e){
  if($("quiz").classList.contains("hide")||e.target.tagName==="INPUT")return;
  var n="1234".indexOf(e.key);
  if(n>=0&&!locked){var b=$("opts").children[n];if(b)b.click()}
  else if((e.key==="Enter"||e.key===" ")&&locked){e.preventDefault();next()}
});
draw();
</script>
